<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotChat</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>.app-title{font-size:2.5rem;font-weight:800;letter-spacing:-.06em}.terminal{background:#080d09;color:#58f27d;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:130px;overflow:auto;border-top:3px solid #193d22}.terminal .muted{color:#8acb98}</style></head><body class="bg-light"><main class="container py-4"><h1 class="app-title">BotChat</h1><p class="text-secondary">Painel de controle</p><div class="row g-3"><section class="col-lg-4"><div class="card p-3 h-100"><h2 class="h5">WhatsApp</h2><p>Status: <strong id="status">Iniciando</strong></p><p id="detalhe" class="small"></p><img id="qr" class="img-fluid d-none" alt="QR Code"><div class="d-grid gap-2 mt-2"><button id="controleBot" onclick="alternarBot()" class="btn btn-danger">Parar bot</button><button onclick="reconectar()" class="btn btn-outline-primary">Forçar reconexão</button></div></div></section><section class="col-lg-8"><div class="card p-3"><h2 class="h5">Mensagem inicial</h2><textarea id="saudacao" class="form-control mb-1" rows="3"></textarea><small class="text-secondary">Use <code>{saudacao}</code> e <code>{nome}</code>.</small><hr><label class="form-check form-switch mb-2"><input id="avisoOn" class="form-check-input" type="checkbox"> Aviso Global ligado</label><textarea id="aviso" class="form-control mb-3" placeholder="Aviso exibido na saudação"></textarea><label class="form-check form-switch mb-2"><input id="expOn" class="form-check-input" type="checkbox"> Horário de expediente ligado</label><div class="row"><label class="col">Início<input id="inicio" type="time" class="form-control"></label><label class="col">Fim<input id="fim" type="time" class="form-control"></label></div><button onclick="salvarConfig()" class="btn btn-primary mt-3">Salvar configurações</button></div></section></div><section class="card p-4 mt-3"><h2 class="h5" id="tituloFormulario">Nova resposta programada</h2><form id="formResposta"><input id="respostaId" type="hidden"><div class="mb-3"><label class="form-label">Título da opção</label><input id="respostaTitulo" class="form-control" required></div><div class="mb-3"><label class="form-label">Texto da resposta</label><textarea id="respostaTexto" class="form-control" rows="4" required></textarea></div><button class="btn btn-primary" type="submit">Salvar resposta</button><button class="btn btn-link" type="button" onclick="limparFormulario()">Cancelar edição</button></form><hr><h2 class="h6">Respostas cadastradas</h2><div id="opcoes"></div></section><section class="card p-3 mt-3"><div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Atendentes</h2><label class="form-check form-switch"><input id="atendimentoHumanoOn" class="form-check-input" type="checkbox" onchange="alternarAtendimentoHumano()"> Atendimento humano ligado</label></div><form id="formAtendente" class="input-group my-2"><input id="atendenteNome" class="form-control" placeholder="Nome do atendente" required><button class="btn btn-success" type="submit">Adicionar atendente</button></form><p class="small text-secondary">Somente nomes ligados aparecem em “Falar com um atendente”.</p><div id="atendentes"></div></section></main><footer class="terminal px-4 py-2"><div class="d-flex justify-content-between"><span class="muted">EVENTOS DO BOT</span><button class="btn btn-sm btn-link p-0 text-success" onclick="limparEventos()">limpar</button></div><div id="eventos"></div></footer><div id="modalSub" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50" style="z-index:20"><div class="card p-4 position-absolute top-50 start-50 translate-middle" style="width:min(560px,92vw)"><h2 class="h5">Adicionar opção dentro da resposta</h2><input id="subId" type="hidden"><label class="form-label">Resposta principal<select id="subPai" class="form-select"></select></label><label class="form-label">Título da nova opção<input id="subTitulo" class="form-control"></label><label class="form-label">Texto da resposta<textarea id="subTexto" class="form-control" rows="3"></textarea></label><div class="mt-3"><button class="btn btn-primary" onclick="salvarSubResposta()">Salvar opção</button><button class="btn btn-link" onclick="fecharSub()">Cancelar</button></div></div></div><script src="renderer.js"></script></body></html>
